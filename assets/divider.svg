<svg xmlns="http://www.w3.org/2000/svg" width="900" height="6" viewBox="0 0 900 6">
  <defs>
    <linearGradient id="shine" x1="-100%" y1="0" x2="0%" y2="0">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0" />
      <stop offset="50%" stop-color="#00b4d8" stop-opacity="1" />
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0" />
      <animate attributeName="x1" values="-100%;100%" dur="4s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%" dur="4s" repeatCount="indefinite" />
    </linearGradient>
  </defs>
  <rect x="0" y="1" width="900" height="4" rx="2" fill="#2c5364" opacity="0.55" />
  <rect x="0" y="1" width="900" height="4" rx="2" fill="url(#shine)" />
</svg>
